<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="遗物警察局地图档案科：通过观察信息反查黑夜君临地图布局。"
    />
    <meta name="theme-color" content="#192226" />
    <link rel="modulepreload" href="src/map-tiles.js?v=preload-1" />
    <script type="module" src="src/map-preload.js?v=preload-1"></script>
    <title>地图档案科｜遗物警察局</title>
    <link rel="stylesheet" href="styles.css?v=names-1" />
  </head>
  <body class="map-page">
    <a class="skip-link" href="#atlas-viewport">跳到工具</a>
    <noscript
      ><p>
        此工具需要启用浏览器的脚本功能才能进行本地检测与地图筛选。
      </p></noscript
    >
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="返回遗物警察局"
        ><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span
        ><span
          ><strong>遗物警察局</strong><small>黑夜君临 · 地图档案</small></span
        ></a
      >
      <nav class="tool-nav" aria-label="工具导航">
        <a href="index.html#checker">遗物检测</a
        ><a aria-current="page" href="map.html">地图档案</a>
      </nav>
    </header>
    <main class="tool-main map-main">
      <section class="atlas" aria-label="交互地图">
        <div class="atlas-toolbar">
          <div>
            <h1>地图档案</h1>
            <span id="atlas-count" role="status">正在载入</span>
          </div>
          <div class="map-top-actions">
            <button id="open-map-settings" type="button">
              筛选<span id="filter-total"></span></button
            ><button id="open-map-results" type="button">查看档案</button>
          </div>
        </div>
        <div class="atlas-body">
          <details id="atlas-layer-menu">
            <summary id="atlas-layer-name">据点</summary>
            <div id="atlas-layers" role="group" aria-label="显示哪类点位"></div>
          </details>
          <div class="atlas-controls">
            <button type="button" id="atlas-in" aria-label="放大地图">＋</button
            ><button type="button" id="atlas-out" aria-label="缩小地图">
              −</button
            ><button type="button" id="atlas-fit">全图</button>
          </div>
          <button type="button" id="atlas-back" class="atlas-back" hidden>
            返回放大前
          </button>
          <span id="atlas-scale" class="atlas-scale" aria-hidden="true"></span>
          <button type="button" id="atlas-undo" class="map-undo" disabled>
            撤销
          </button>
          <div
            id="atlas-viewport"
            tabindex="0"
            role="region"
            aria-label="可拖动和缩放的地图；方向键移动，加减键缩放，点位可通过制表键选择"
          >
            <button type="button" id="atlas-depth" class="atlas-depth" hidden>
              地表 · 切换地下
            </button>
            <div id="atlas-tiles" aria-hidden="true"></div>
            <svg id="atlas-leaders" aria-hidden="true"></svg>
            <div id="atlas-points"></div>
            <div id="atlas-labels" aria-hidden="true"></div>
            <div id="atlas-toast" role="status" hidden></div>
            <p id="atlas-loading" role="status" hidden>正在载入地图…</p>
          </div>
          <section
            id="atlas-editor"
            aria-labelledby="atlas-point-title"
            hidden
          ></section>
        </div>
        <p id="atlas-hint" class="sr-only"></p>
        <p id="atlas-status" role="status" class="sr-only"></p>
      </section>
      <dialog
        id="map-settings"
        class="map-drawer compact-settings"
        aria-labelledby="settings-title"
      >
        <div class="drawer-heading">
          <h2 id="settings-title">
            筛选 <small id="settings-count" role="status"></small>
          </h2>
          <div class="settings-tabs" role="group" aria-label="设置分类">
            <button
              type="button"
              id="settings-filter-tab"
              aria-pressed="true"
              aria-controls="settings-filter-pane"
            >
              条件
            </button>
            <button
              type="button"
              id="settings-display-tab"
              aria-pressed="false"
              aria-controls="settings-display-pane"
            >
              显示
            </button>
          </div>
          <button type="button" data-close-drawer="map-settings">完成</button>
        </div>
        <div class="settings-scroll">
          <section id="settings-filter-pane" aria-label="筛选条件">
            <div id="atlas-facets"></div>
            <section
              class="map-workbench"
              aria-label="地图筛选工作台"
              id="map-query-title"
            >
              <div class="map-input-column">
                <form id="map-form" aria-busy="true">
                  <details id="base-filters" hidden>
                    <summary>出生位置</summary>
                    <div class="base-filter-fields">
                      <label
                        ><span>夜王</span
                        ><select id="nightlord">
                          <option value="">不限</option>
                        </select></label
                      >
                      <label
                        ><span>特殊地形</span
                        ><select id="map-type">
                          <option value="">不限</option>
                        </select></label
                      >
                      <label
                        ><span>出生点</span
                        ><select id="spawn">
                          <option value="">不限</option>
                        </select></label
                      >
                    </div>
                  </details>
                  <details class="active-filters" aria-label="已选条件">
                    <summary>
                      已选条件 <span id="active-filter-count"></span>
                    </summary>
                    <div id="filter-chips"></div>
                    <p id="filter-empty" hidden></p>
                  </details>
                  <details id="text-search" class="clue-builder" open>
                    <summary>敌人 / 据点</summary>
                    <section aria-label="敌人或据点搜索">
                      <label class="sr-only" for="clue-search"
                        >搜索敌人或据点</label
                      >
                      <input
                        id="clue-search"
                        type="search"
                        placeholder="搜索敌人、据点"
                        autocomplete="off"
                      />
                      <div
                        id="quick-clues"
                        class="quick-searches"
                        aria-label="常用搜索"
                      ></div>
                      <details id="location-details">
                        <summary>限定位置</summary>
                        <div class="clue-filters">
                          <label
                            ><span>类型</span
                            ><select id="clue-category">
                              <option value="">全部类型</option>
                            </select></label
                          >
                          <label
                            ><span>位置</span
                            ><select id="clue-location">
                              <option value="">不限</option>
                            </select></label
                          >
                        </div>
                      </details>
                      <p id="clue-count" class="sr-only" role="status"></p>
                      <div id="clue-results" class="clue-results"></div>
                      <button
                        id="more-clues"
                        type="button"
                        class="secondary"
                        hidden
                      >
                        更多
                      </button>
                    </section>
                  </details>
                  <p
                    id="map-feedback"
                    class="selection-feedback sr-only"
                    role="status"
                  ></p>
                </form>
              </div>
            </section>
          </section>
          <section id="settings-display-pane" aria-label="地图显示" hidden>
            <details class="map-guide" id="atlas-display-settings" open>
              <summary class="sr-only">地图显示</summary>
              <label class="atlas-setting-check"
                ><input
                  id="atlas-autozoom"
                  type="checkbox"
                  checked
                />点击密集处放大</label
              >
            </details>
          </section>
        </div>
        <div class="form-actions settings-actions">
          <button class="secondary" type="button" id="undo-map" disabled>
            撤销
          </button>
          <button
            class="secondary"
            type="reset"
            form="map-form"
            aria-label="清空全部条件"
          >
            清空
          </button>
          <button class="secondary" type="button" id="share-map">分享</button>
          <button type="button" id="settings-results">查看结果</button>
        </div>
      </dialog>
      <dialog
        id="map-results-dialog"
        class="map-drawer"
        aria-labelledby="results-title"
      >
        <div class="drawer-heading">
          <div>
            <h2 id="results-title">候选档案</h2>
          </div>
          <button type="button" id="results-filters">调整筛选</button>
          <button type="button" data-close-drawer="map-results-dialog">
            返回地图
          </button>
        </div>
        <aside id="map-output" class="map-output" aria-label="地图筛选结果">
          <section class="candidate-panel" aria-live="polite">
            <div class="candidate-count">
              <strong id="candidate-count">—</strong><span>份候选档案</span>
            </div>
            <div>
              <p class="kicker">下一条线索</p>
              <h3 id="next-clue">等待基础信息</h3>
              <p id="candidate-summary">正在载入…</p>
              <button class="clue-action" id="use-clue" type="button" hidden>
                记录这处线索
              </button>
            </div>
          </section>
          <section id="map-result" class="map-result" hidden></section>
          <section id="candidate-list" aria-label="候选地图"></section>
          <details class="data-notes">
            <summary>数据范围</summary>
            <p id="map-version"></p>
          </details>
        </aside>
      </dialog>
      <a id="map-result-link" href="#map-output" hidden>查看档案</a>
    </main>
    <button class="retry" id="retry" hidden>重新加载地图</button>
    <footer>
      <span>遗物警察局 · 地图档案科</span
      ><span>本体与见弃空洞者 · 520 份布局。</span>
    </footer>
    <script type="module" src="src/map.js?v=names-1"></script>
  </body>
</html>
