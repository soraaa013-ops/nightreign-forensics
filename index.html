<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="遗物警察局：黑夜君临遗物词条合法性检测工具。"
    />
    <meta name="theme-color" content="#090b0e" />
    <title>遗物警察局｜遗物合法检测</title>
    <link rel="stylesheet" href="styles.css?v=compact-1" />
  </head>
  <body>
    <a class="skip-link" href="#checker">跳到工具</a>
    <noscript
      ><p>
        此工具需要启用浏览器的脚本功能才能进行本地检测与地图筛选。
      </p></noscript
    >
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="遗物警察局首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span
          ><strong>遗物警察局</strong><small>黑夜君临 · 玩家工具</small></span
        >
      </a>
      <div class="header-tools">
        <nav class="tool-nav" aria-label="工具导航">
          <a aria-current="page" href="index.html#checker">遗物检测</a
          ><a href="map.html">地图档案</a>
        </nav>
        <div class="case-status">
          <span></span><b id="data-stats">正在载入</b>
        </div>
      </div>
    </header>

    <main id="top" class="tool-main">
      <div class="page-heading">
        <div>
          <p class="kicker">黑夜君临 · 遗物工具</p>
          <h1>遗物检测</h1>
        </div>
      </div>
      <section class="relic-workspace" id="checker" aria-label="遗物检测工作台">
        <div class="relic-search-column">
          <label class="template-field"
            ><span>遗物颜色</span
            ><select id="template" form="relic-form" required disabled>
              <option>规则载入中…</option>
            </select></label
          >
          <section id="effect-picker" aria-labelledby="picker-title">
            <div class="picker-header">
              <div>
                <p class="kicker" id="picker-step">选择词条</p>
                <h2 id="picker-title">搜索并添加词条</h2>
              </div>
              <a class="secondary" href="#selected-panel">查看已选</a>
            </div>
            <label class="picker-search"
              ><span>搜索词条</span
              ><input
                type="search"
                id="effect-query"
                placeholder="例如：回血、追踪者 大招、出击 火焰"
                autocomplete="off"
            /></label>
            <div class="picker-filters">
              <label
                ><span>效果类型</span
                ><select id="effect-category">
                  <option value="">全部类型</option>
                </select></label
              ><label
                ><span>角色</span
                ><select id="effect-character">
                  <option value="">全部角色</option>
                </select></label
              ><button
                type="button"
                class="secondary"
                id="reset-effect-filters"
              >
                清除筛选
              </button>
            </div>
            <label class="toggle-field"
              ><input
                type="checkbox"
                id="include-unsupported"
              />同时查看当前模板无法抽取的词条</label
            >
            <div
              id="slot-tabs"
              class="slot-tabs"
              role="group"
              aria-label="选择要填写的词条位置"
            ></div>
            <p id="selection-feedback" class="selection-feedback" role="status">
              点击词条填入第一条，随后可以继续选择。
            </p>
            <p id="effect-count" role="status"></p>
            <div id="effect-results" class="effect-results"></div>
            <button type="button" id="more-effects" class="secondary" hidden>
              显示更多词条
            </button>
          </section>
        </div>
        <aside
          id="selected-panel"
          class="selected-panel"
          aria-label="已选遗物与报告"
        >
          <form id="relic-form" aria-busy="true">
            <div class="panel-heading">
              <h2 id="checker-title">已选词条</h2>
              <button
                type="button"
                id="undo-relic"
                class="text-button"
                disabled
              >
                撤销上一步
              </button>
            </div>
            <div
              class="slots"
              id="selected-effects"
              aria-label="已选词条"
            ></div>
            <p id="form-error" role="alert"></p>
            <div class="form-actions">
              <button class="secondary" type="button" id="randomize">
                填入示例</button
              ><button class="secondary" type="reset">清空</button
              ><button class="secondary" type="submit">重新检测</button>
            </div>
          </form>
          <p class="status-message" id="action-status" role="status"></p>
          <button class="retry" id="retry" hidden>重新加载规则</button>
          <section
            class="report"
            id="report"
            aria-live="polite"
            aria-labelledby="report-title"
          >
            <div class="report-stamp" id="report-stamp">待检</div>
            <div class="report-copy">
              <p class="kicker">检测报告</p>
              <h3 id="report-title">等待检材</h3>
              <p id="report-summary">请选择三条词条。</p>
              <p class="report-probability" id="report-probability" hidden></p>
              <ol id="report-order" hidden></ol>
              <p class="report-meta">
                规则集：<span id="ruleset-version">载入中</span> ·
                <span id="report-code">等待检材</span>
              </p>
            </div>
          </section>
          <button class="submit" type="button" id="copy-report" disabled>
            复制报告链接
          </button>
        </aside>
      </section>
      <details class="data-notes">
        <summary>数据范围与检测规则</summary>
        <p>深夜诅咒配对暂未开放。当前数据版本见报告。</p>
      </details>
      <a
        id="relic-result-link"
        class="mobile-result-link"
        href="#selected-panel"
        >已选 0 / 3 条 · 查看已选</a
      >
    </main>
    <footer>
      <span>遗物警察局 · 非官方玩家工具</span><span>谨慎截图，理性出警。</span>
    </footer>
    <script type="module" src="src/app.js?v=search-1"></script>
  </body>
</html>
